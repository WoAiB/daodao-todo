<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<script>
  /* 自动主题：20:00–次日 7:00 为夜间，其余为白天（提前写入避免闪白/闪黑） */
  (function () {
    var h = new Date().getHours();
    document.documentElement.dataset.theme = (h >= 20 || h < 7) ? 'night' : 'day';
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>叨叨清单 · Daodao List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
  /* ============ 主题变量 ============ */
  :root {
    /* 类别色（马卡龙糖果色，可在设置中修改，修改后持久化） */
    --c-ddl:   #EF6E5A;   /* 课程 DDL · 红 */
    --c-meet:  #EFAF3C;   /* 学术会议 · 黄 */
    --c-class: #55B37E;   /* 日常上课 · 绿 */
    --c-sport: #EF87A5;   /* 体育运动 · 粉 */
    --c-study: #6B9CD8;   /* 学习打卡 · 蓝 */
    --c-life:  #A59E96;   /* 生活杂事 · 灰 */

    --hour-h: 56px;
    --gutter-w: 56px;
  }
  html[data-theme="day"] {
    --bg1: #F7EAE1;         /* 温暖肉色偏粉 */
    --bg2: #F2DCD1;
    --card: #FFFDFB;
    --card-2: #FAF1EB;
    --text: #46362F;
    --text-2: #A08980;
    --text-3: #C9B6AC;
    --line: #EDDCCC;
    --line-soft: #F3E6DC;
    --shadow: 0 8px 28px rgba(178, 127, 105, 0.12);
    --shadow-sm: 0 2px 10px rgba(178, 127, 105, 0.10);
    --today: #F0554A;
    --evt-text: #FFFFFF;
    --gutter-text: #C2ACA1;
    --scroll-thumb: #E5D0C2;
  }
  html[data-theme="night"] {
    --bg1: #0E0C0C;         /* 黑 */
    --bg2: #090808;
    --card: #191616;
    --card-2: #211D1D;
    --text: #EFE9E4;
    --text-2: #928A85;
    --text-3: #5E5652;
    --line: #2B2625;
    --line-soft: #241F1E;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.4);
    --today: #F0554A;
    --evt-text: #FFFFFF;
    --gutter-text: #4E4643;
    --scroll-thumb: #332D2C;
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--text);
    overflow: hidden;
    transition: background 0.35s ease, color 0.35s ease;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 5px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 顶栏 ============ */
  #topbar {
    height: 64px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; user-select: none; }
  .brand svg { width: 36px; height: 36px; display: block; }
  .brand-text b { font-size: 16px; letter-spacing: 0.5px; display: block; line-height: 1.2; }
  .brand-text i { font-style: normal; font-size: 10.5px; color: var(--text-3); letter-spacing: 1px; }

  .voice-pill {
    flex: 1; max-width: 460px; margin-left: 8px;
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 999px;
    padding: 9px 18px;
    box-shadow: var(--shadow-sm);
    color: var(--text-2); font-size: 13.5px;
    cursor: pointer; user-select: none;
    transition: box-shadow 0.2s;
  }
  .voice-pill:hover { box-shadow: var(--shadow); }
  .voice-pill svg { width: 17px; height: 17px; flex: none; color: var(--c-ddl); }
  .voice-pill kbd {
    margin-left: auto; font-size: 11px; color: var(--text-3);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px;
    font-family: inherit;
  }
  .voice-pill.listening { background: var(--today); color: #fff; }
  .voice-pill.listening svg { color: #fff; animation: mic-pulse 1.1s ease-in-out infinite; }
  .voice-pill.listening kbd { display: none; }
  .voice-pill.listening span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes mic-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.65; } }

  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    display: flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 12px; border-radius: 11px;
    color: var(--text-2); font-size: 13px;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn.bare { padding: 0; width: 36px; justify-content: center; }

  /* ============ 主布局 ============ */
  #layout {
    height: calc(100vh - 64px);
    display: flex; gap: 12px;
    padding: 0 16px 16px;
    position: relative;
  }
  #leftPanels {
    width: var(--left-w, 640px); flex: none;
    display: flex; gap: 12px;
    min-width: 480px; max-width: 860px;
  }
  .panel {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px 16px;
    display: flex; flex-direction: column;
    min-height: 0;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }

  /* ---- 拖拽分隔条 ---- */
  #dragBar {
    flex: none; width: 7px; margin: 0 -3px;
    border-radius: 4px; cursor: col-resize;
    position: relative; z-index: 5;
  }
  #dragBar::after {
    content: ""; position: absolute; inset: 45% 2px;
    border-radius: 3px; background: var(--line);
    transition: background 0.15s;
  }
  #dragBar:hover::after, #dragBar.active::after { background: var(--c-sport); }

  /* ============ 今日 To Do ============ */
  #todayPanel { flex: 1.18; overflow-y: auto; }
  #weekPanel { flex: 1; overflow-y: auto; }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .panel-head h1 { font-size: 16.5px; letter-spacing: 0.3px; }
  .panel-head .date { font-size: 12px; color: var(--text-2); }
  .day-progress { margin: 10px 0 14px; }
  .day-progress .row {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--text-2); margin-bottom: 6px;
  }
  .day-progress .row b { color: var(--c-sport); font-weight: 600; }
  .track { height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #F7B26C, var(--c-sport));
    transition: width 0.4s cubic-bezier(.22,1,.36,1); }

  .group-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--text-3); letter-spacing: 2px;
    margin: 14px 2px 8px;
  }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  .task {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 10px; border-radius: 12px;
    position: relative; overflow: hidden;
    transition: background 0.15s;
  }
  .task:hover { background: var(--card-2); }
  .task::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px;
    width: 3.5px; border-radius: 2px; background: var(--cat);
  }
  .task .cb {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--text-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: transparent;
    transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .task:hover .cb { border-color: var(--cat); }
  .task.done .cb { background: var(--cat); border-color: var(--cat); color: #fff; }
  @keyframes pop { 0% { transform: scale(0.6);} 60% { transform: scale(1.18);} 100% { transform: scale(1);} }
  .task.done .cb { animation: pop 0.28s cubic-bezier(.34,1.56,.64,1); }
  .task-main { min-width: 0; }
  .task-title { font-size: 13.5px; line-height: 1.35; transition: color 0.2s; }
  .task.done .task-title { color: var(--text-3); text-decoration: line-through; }
  .task-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .pill {
    font-size: 10px; padding: 1px 7px; border-radius: 999px; line-height: 1.5;
    background: color-mix(in srgb, var(--cat) 14%, var(--card));
    color: color-mix(in srgb, var(--cat) 82%, var(--text));
  }
  .task-meta .warn { color: var(--c-ddl); font-weight: 600; }

  .add-task {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 9px; font-size: 12.5px; color: var(--text-3);
    transition: all 0.15s;
  }
  .add-task:hover { border-color: var(--c-sport); color: var(--c-sport); }

  /* ============ 本周待办 ============ */
  .routines { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
  .routine-card {
    background: var(--card-2); border-radius: 12px; padding: 9px 11px;
  }
  .routine-card.paused { opacity: 0.5; }
  .routine-card .rt { display: flex; justify-content: space-between; align-items: baseline; }
  .routine-card .rt span { font-size: 12px; }
  .routine-card .rt i { font-style: normal; font-size: 11px; color: var(--text-2); }
  .routine-card .track { height: 4px; margin-top: 7px; }
  .routine-card .track > i { background: var(--cat); }

  .week-day-head {
    display: flex; align-items: baseline; gap: 7px;
    margin: 15px 2px 7px; font-size: 12.5px;
  }
  .week-day-head i { font-style: normal; font-size: 11px; color: var(--text-3); }
  .week-day-head .auto-in { margin-left: auto; font-size: 10px; color: var(--c-sport); }
  .week-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: 11px; font-size: 12.5px;
    transition: background 0.15s; cursor: pointer;
  }
  .week-item:hover { background: var(--card-2); }
  .week-item .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
  .week-item .wi-title { min-width: 0; flex: 1; transition: color 0.2s; }
  .week-item.done .wi-title { color: var(--text-3); text-decoration: line-through; }
  .week-item.done .dot { opacity: 0.35; }
  .week-item .wi-meta { font-size: 10.5px; color: var(--text-3); }
  .week-item .wi-meta.warn { color: var(--c-ddl); }
  .week-item .wi-check {
    flex: none; width: 17px; height: 17px; border-radius: 50%;
    border: 1.5px solid var(--text-3);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent;
    transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .week-item:hover .wi-check { border-color: var(--cat); }
  .week-item.done .wi-check { background: var(--cat); border-color: var(--cat); color: #fff; }

  /* ============ 日历（苹果风格周视图） ============ */
  #calendarPanel { flex: 1; padding: 0; min-width: 0; }
  .cal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 18px 11px;
  }
  .cal-title { display: flex; align-items: center; gap: 4px; }
  .cal-title h2 { font-size: 16.5px; font-weight: 700; letter-spacing: 0.3px; }
  .nav-btn {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2); font-size: 15px; line-height: 1;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: var(--card-2); color: var(--text); }
  .cal-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .today-btn {
    font-size: 12.5px; color: var(--today);
    background: color-mix(in srgb, var(--today) 10%, var(--card));
    padding: 5px 13px; border-radius: 999px;
  }
  .today-btn:hover { background: color-mix(in srgb, var(--today) 18%, var(--card)); }
  .seg {
    display: flex; background: var(--card-2); border-radius: 9px; padding: 2.5px;
  }
  .seg button {
    font-size: 12px; padding: 4px 14px; border-radius: 7px;
    color: var(--text-2); transition: all 0.15s;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }
  .seg button:disabled { opacity: 0.45; cursor: not-allowed; }

  .cal-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 0 6px 46px 0; }
  .cal-grid { min-width: 620px; }

  .cal-header-row, .allday-row {
    display: grid; grid-template-columns: var(--gutter-w) repeat(7, 1fr);
  }
  .cal-header-row { border-bottom: 1px solid var(--line); }
  .gh-day {
    text-align: center; padding: 7px 0 9px; user-select: none;
  }
  .gh-day span { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 3px; letter-spacing: 1px; }
  .gh-day b {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 17px; font-weight: 600;
  }
  .gh-day.today span { color: var(--today); font-weight: 600; }
  .gh-day.today b { background: var(--today); color: #fff; }

  .allday-row { border-bottom: 1px solid var(--line); min-height: 34px; }
  .gutter-label {
    font-size: 10.5px; color: var(--text-3);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 10px;
  }
  .ad-cell { padding: 5px 3px; display: flex; flex-direction: column; gap: 3px; }
  .ad-pill {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: color-mix(in srgb, var(--c) 16%, var(--card));
    color: color-mix(in srgb, var(--c) 85%, var(--text));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 500;
  }

  .time-area { position: relative; }
  .hour-label {
    position: absolute; left: 0; width: var(--gutter-w);
    font-size: 10.5px; color: var(--gutter-text);
    text-align: right; padding-right: 10px; transform: translateY(-6px);
    user-select: none;
  }
  .hour-line { position: absolute; left: var(--gutter-w); right: 0; height: 1px; background: var(--line-soft); }
  .cols-wrap { margin-left: var(--gutter-w); display: flex; height: calc(var(--hour-h) * 14); }
  .col { flex: 1; position: relative; border-left: 1px solid var(--line-soft); }
  .col:last-child { border-right: 1px solid var(--line-soft); }

  .evt {
    position: absolute;
    background: var(--c); color: var(--evt-text);
    border-radius: 7px; padding: 5px 8px; overflow: hidden;
    cursor: pointer;
    box-shadow: 0 1px 4px color-mix(in srgb, var(--c) 35%, transparent);
    transition: transform 0.12s, filter 0.12s;
  }
  html[data-theme="night"] .evt { box-shadow: 0 1px 4px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08); }
  .evt:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .evt .evt-t { font-size: 11.5px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evt .evt-s { font-size: 10px; opacity: 0.85; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evt.sm { display: flex; align-items: center; padding: 0 8px; }
  .evt.sm .evt-s { display: none; }

  .now-line {
    position: absolute; left: var(--gutter-w); right: 0;
    height: 2px; background: var(--today); border-radius: 1px;
    pointer-events: none; z-index: 3;
  }
  .now-line .dot {
    position: absolute; left: -5px; top: -4px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--today);
  }
  .now-line .tag {
    position: absolute; left: -46px; top: -8px;
    font-size: 10.5px; font-weight: 600; color: var(--today);
    background: var(--card); padding: 1px 5px; border-radius: 5px;
    box-shadow: var(--shadow-sm);
  }

  /* ============ 吉祥物（右下角） ============ */
  .mascot-corner {
    position: absolute; right: 22px; bottom: 20px;
    display: flex; align-items: flex-end; gap: 10px;
    z-index: 20; pointer-events: none;
  }
  .bubble {
    position: relative;
    background: var(--card); border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 9px 14px; font-size: 13px;
    margin-bottom: 22px;
    animation: bubble-in 0.5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes bubble-in { from { opacity: 0; transform: translateY(8px) scale(0.9);} to { opacity: 1; transform: none;} }
  .bubble::after {
    content: ""; position: absolute; right: -5px; bottom: 12px;
    width: 12px; height: 12px; background: var(--card);
    border-radius: 3px; transform: rotate(45deg);
  }
  .mascot-corner .mascot {
    width: 68px; height: 68px;
    animation: bob 3.6s ease-in-out infinite;
    filter: drop-shadow(0 6px 12px rgba(150, 100, 70, 0.25));
    pointer-events: auto; cursor: pointer;
    transition: transform 0.2s;
  }
  .mascot-corner .mascot:hover { transform: scale(1.08); }
  @keyframes bob { 0%, 100% { transform: translateY(0);} 50% { transform: translateY(-7px);} }

  @media (prefers-reduced-motion: reduce) {
    .mascot-corner .mascot, .bubble, .task.done .cb { animation: none; }
  }

  /* ============ 完成庆祝动效 ============ */
  .celebrate {
    position: fixed; inset: 0; z-index: 400;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
  }
  .celebrate.show { animation: celeb-fade 1.7s ease forwards; }
  @keyframes celeb-fade { 0% {opacity:0} 8% {opacity:1} 82% {opacity:1} 100% {opacity:0} }
  .celebrate .glow {
    position: absolute; left: 50%; top: 50%;
    width: 240px; height: 240px; margin: -120px 0 0 -120px;
    border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, #FFC94D 40%, transparent), transparent);
  }
  .celebrate .face {
    width: 116px; height: 116px; position: relative;
    filter: drop-shadow(0 8px 20px rgba(150, 100, 70, 0.35));
    animation: face-pop 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes face-pop { 0% { transform: scale(0.2) rotate(-14deg);} 60% { transform: scale(1.14) rotate(4deg);} 100% { transform: scale(1) rotate(0);} }
  .celebrate .celebrate-txt {
    position: relative; z-index: 1; margin-top: 16px;
    font-size: 19px; font-weight: 700; letter-spacing: 2px;
    color: var(--text);
    background: var(--card);
    padding: 7px 18px; border-radius: 999px;
    box-shadow: var(--shadow);
    animation: txt-up 0.5s cubic-bezier(.22,1,.36,1) 0.12s both;
  }
  @keyframes txt-up {
    from { opacity: 0; transform: translateY(16px) scale(0.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .fw-p {
    position: absolute; left: 50%; top: calc(50% - 24px);
    border-radius: 50%;
    animation: fw-fly 1s cubic-bezier(.16,.84,.44,1) forwards;
  }
  @keyframes fw-fly {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    70%  { opacity: 0.9; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.15); opacity: 0; }
  }

  /* ============ 弹层（Routine 看板 / 设置） ============ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 250;
    background: rgba(40, 26, 20, 0.38);
    backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center;
  }
  html[data-theme="night"] .modal-backdrop { background: rgba(0, 0, 0, 0.6); }
  .modal-backdrop.show { display: flex; animation: fade-in 0.18s ease; }
  @keyframes fade-in { from { opacity: 0; } }
  .modal {
    width: 580px; max-width: 92vw; max-height: 84vh;
    overflow-y: auto;
    background: var(--card); border-radius: 20px;
    box-shadow: var(--shadow); padding: 22px 24px;
    animation: modal-in 0.28s cubic-bezier(.22,1,.36,1);
  }
  @keyframes modal-in { from { transform: translateY(18px) scale(0.97); opacity: 0; } }
  .modal-head { display: flex; align-items: center; margin-bottom: 4px; }
  .modal-head h2 { font-size: 17px; letter-spacing: 0.3px; }
  .modal-head .sub { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
  .modal-close {
    margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-2); transition: all 0.15s;
  }
  .modal-close:hover { background: var(--card-2); color: var(--text); }

  /* Routine 卡片 */
  .rt-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card-2); border-radius: 14px;
    padding: 13px 15px; margin-top: 10px;
  }
  .rt-card.paused { opacity: 0.55; }
  .rt-card .rt-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cat); }
  .rt-card .rt-info { flex: 1; min-width: 0; }
  .rt-card .rt-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .rt-card .rt-name .paused-tag {
    font-size: 10px; font-weight: 400; color: var(--text-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 7px;
  }
  .rt-card .rt-meta { font-size: 11.5px; color: var(--text-2); margin-top: 4px; }
  .rt-card .rt-meta b { color: var(--c-sport); font-weight: 600; }
  .rt-card .rt-prog { width: 110px; flex: none; }
  .rt-card .rt-prog .pct { font-size: 11px; color: var(--text-2); margin-bottom: 5px; text-align: right; }
  .rt-card .rt-prog .track { height: 5px; }
  .rt-card .rt-prog .track > i { background: var(--cat); }
  .rt-card .rt-ops { display: flex; flex-direction: column; gap: 5px; flex: none; }
  .rt-card .rt-ops button {
    font-size: 11.5px; padding: 4px 12px; border-radius: 8px;
    color: var(--text-2); background: var(--card); transition: all 0.15s;
  }
  .rt-card .rt-ops button:hover { color: var(--text); }
  .rt-card .rt-ops .danger:hover { color: var(--c-ddl); }

  .rt-add {
    margin-top: 12px; width: 100%;
    border: 1.5px dashed var(--line); border-radius: 13px;
    padding: 11px; font-size: 13px; color: var(--text-2);
    transition: all 0.15s;
  }
  .rt-add:hover { border-color: var(--c-sport); color: var(--c-sport); }

  /* 奖章墙 */
  .bd-hero { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 2px; }
  .bd-hero .num { font-size: 34px; font-weight: 700; color: var(--c-sport); line-height: 1; }
  .bd-hero .lbl { font-size: 12.5px; color: var(--text-2); }
  .bd-ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .bd-rw {
    border: 1.5px solid var(--line); border-radius: 13px; background: var(--card-2);
    padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.15s;
  }
  .bd-rw:not(:disabled):hover { border-color: var(--c-sport); transform: translateY(-1px); }
  .bd-rw:disabled { opacity: 0.45; cursor: not-allowed; }
  .bd-rw .bd-rw-cost { font-size: 16px; font-weight: 700; color: var(--c-sport); }
  .bd-rw .bd-rw-name { font-size: 12px; font-weight: 600; margin-top: 3px; }
  .bd-rw .bd-rw-hint { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }
  .bd-group { margin-top: 14px; }
  .bd-group-title {
    font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 7px;
  }
  .bd-group-title .sub { font-size: 11px; color: var(--text-3); font-weight: 400; }
  .bd-medals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bd-medal {
    border: 1.5px solid var(--line); border-radius: 13px; background: var(--card-2);
    padding: 11px 8px; text-align: center;
  }
  .bd-medal .ico { font-size: 24px; line-height: 1.2; }
  .bd-medal.locked { opacity: 0.5; }
  .bd-medal.locked .ico { filter: grayscale(1); }
  .bd-medal .nm { font-size: 11.5px; font-weight: 600; margin-top: 5px; }
  .bd-medal .sub { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }
  .bd-hist { margin-top: 14px; }
  .bd-hist-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 12.5px; padding: 7px 2px; border-bottom: 1px dashed var(--line);
  }
  .bd-hist-row .meta { font-size: 11px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
  .bd-hist-row button { border: none; background: none; color: var(--c-study); cursor: pointer; font-size: 11px; padding: 0; }
  .bd-hist-row button:hover { text-decoration: underline; }

  /* Routine 表单 */
  .rt-form {
    background: var(--card-2); border-radius: 14px;
    padding: 15px; margin-top: 12px;
  }
  .rt-form .f-label { font-size: 11px; color: var(--text-2); margin: 10px 0 6px; }
  .rt-form .f-label:first-child { margin-top: 0; }
  .rt-form input[type="text"], .rt-form input[type="time"], .rt-form select {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text);
    font-size: 13px; padding: 8px 11px; outline: none;
  }
  .rt-form input:focus, .rt-form select:focus { border-color: var(--c-sport); }
  .rt-form .f-row { display: flex; gap: 10px; }
  .rt-form .f-row > * { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 5px 13px; border-radius: 999px;
    border: 1.5px solid var(--line); color: var(--text-2);
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--c-sport); }
  .chip.on { background: var(--text); border-color: var(--text); color: var(--card); }
  .f-btns { display: flex; gap: 9px; margin-top: 15px; }
  .f-btns button {
    flex: 1; font-size: 13px; padding: 9px 0; border-radius: 10px;
    transition: all 0.15s;
  }
  .f-btns .save { background: var(--today); color: #fff; font-weight: 600; }
  .f-btns .save:hover { filter: brightness(1.08); }
  .f-btns .cancel { background: var(--card); color: var(--text-2); }
  .f-btns .cancel:hover { color: var(--text); }

  /* 设置 · 类别颜色 */
  .cat-row {
    display: flex; flex-direction: column; gap: 8px;
    padding: 11px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .cat-row:last-of-type { border-bottom: none; }
  .cat-row-main { display: flex; align-items: center; gap: 13px; }
  .cat-row .cat-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--cc); flex: none; }
  .cat-row .cat-name { font-size: 13.5px; flex: 1; }
  .cat-row .cat-hex { font-size: 11px; color: var(--text-3); font-family: ui-monospace, Consolas, monospace; }
  .cat-kw-row { display: flex; align-items: center; gap: 8px; padding-left: 26px; }
  .cat-kw-label { font-size: 11px; color: var(--text-3); flex: none; }
  .cat-kw-input {
    flex: 1; min-width: 0;
    border: 1.5px solid var(--line); border-radius: 8px;
    background: var(--card-2); color: var(--text);
    font-size: 12px; padding: 5px 9px; outline: none;
  }
  .cat-kw-input:focus { border-color: var(--c-sport); }
  .cat-row input[type="color"] {
    width: 36px; height: 36px; border: none; border-radius: 10px;
    background: none; padding: 0; cursor: pointer;
  }
  .cat-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .cat-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 9px; }
  .settings-note { font-size: 11.5px; color: var(--text-2); margin-top: 12px; line-height: 1.6; }
  .reset-colors {
    margin-top: 12px; font-size: 12px; color: var(--text-2);
    padding: 7px 14px; border-radius: 9px; background: var(--card-2);
    transition: all 0.15s;
  }
  .reset-colors:hover { color: var(--c-ddl); }

  /* 类别管理：名称可编辑 / 新增 / 删除 */
  .cat-row .cat-name-input {
    flex: 1; min-width: 0;
    border: 1.5px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text);
    font-size: 13.5px; padding: 4px 8px; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .cat-row .cat-name-input:hover { border-color: var(--line); }
  .cat-row .cat-name-input:focus { border-color: var(--c-sport); background: var(--card-2); }
  .cat-row .cat-del {
    flex: none; width: 24px; height: 24px; border-radius: 8px;
    color: var(--text-3); font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .cat-row .cat-del:hover { background: color-mix(in srgb, var(--c-ddl) 12%, var(--card)); color: var(--c-ddl); }
  .add-cat {
    margin-top: 12px; width: 100%;
    border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 9px; font-size: 12.5px; color: var(--text-2);
    transition: all 0.15s;
  }
  .add-cat:hover { border-color: var(--c-sport); color: var(--c-sport); }
  .cat-add-form {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px; padding: 10px;
    background: var(--card-2); border-radius: 12px;
  }
  .cat-add-form input[type="text"] {
    flex: 1; min-width: 0;
    border: 1.5px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--text);
    font-size: 13px; padding: 7px 10px; outline: none;
  }
  .cat-add-form input[type="text"]:focus { border-color: var(--c-sport); }
  .cat-add-form input[type="color"] {
    width: 34px; height: 34px; border: none; border-radius: 9px;
    background: none; padding: 0; cursor: pointer; flex: none;
  }
  .cat-add-form input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .cat-add-form input[type="color"]::-webkit-color-swatch { border: none; border-radius: 9px; }
  .cat-add-form button { flex: none; font-size: 12px; padding: 7px 13px; border-radius: 9px; }
  .cat-add-form .save { background: var(--today); color: #fff; font-weight: 600; }
  .cat-add-form .save:hover { filter: brightness(1.08); }
  .cat-add-form .cancel { background: var(--card); color: var(--text-2); }
  .cat-add-form .cancel:hover { color: var(--text); }

  /* 拖拽改期：落点高亮 */
  .gh-day.drag-over, .ad-cell.drag-over, .col.drag-over, .mday.drag-over {
    background: color-mix(in srgb, var(--c-sport) 22%, var(--card));
    outline: 2px dashed var(--c-sport); outline-offset: -2px;
  }
  #todayPanel.drag-over {
    outline: 2px dashed var(--c-sport); outline-offset: -6px;
  }

  /* 已完成 / 归档列表 */
  .done-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px; border-bottom: 1px dashed var(--line);
    font-size: 12.5px;
  }
  .done-item:last-child { border-bottom: none; }
  .done-item .d-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
  .done-item .d-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .done-item .d-date { flex: none; font-size: 11px; color: var(--text-3); }
  .done-item .d-ops { flex: none; display: flex; gap: 4px; }
  .done-item .d-ops button {
    font-size: 11px; padding: 3px 9px; border-radius: 7px;
    background: var(--card-2); color: var(--text-2); transition: all 0.15s;
  }
  .done-item .d-ops button:hover { color: var(--text); }
  .done-item .d-ops .del:hover { color: var(--c-ddl); background: color-mix(in srgb, var(--c-ddl) 12%, var(--card)); }

  /* ============ 标注模式 ============ */
  .anno-btn {
    position: fixed; left: 20px; bottom: 20px; z-index: 200;
    display: flex; align-items: center; gap: 7px;
    background: var(--card); color: var(--text);
    border-radius: 999px; padding: 9px 16px;
    font-size: 13px; box-shadow: var(--shadow);
    transition: all 0.15s; user-select: none;
  }
  .anno-btn:hover { transform: translateY(-2px); }
  .anno-btn.on { background: var(--today); color: #fff; }
  .anno-btn svg { width: 15px; height: 15px; }

  .anno-hint {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 200; background: var(--today); color: #fff;
    font-size: 12.5px; padding: 7px 18px; border-radius: 999px;
    box-shadow: var(--shadow); display: none;
  }
  body.annotating { cursor: crosshair; }
  body.annotating .anno-hint { display: block; }
  body.annotating * { cursor: crosshair !important; }

  #annoLayer { position: fixed; inset: 0; z-index: 150; pointer-events: none; }
  .anno-pin {
    position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px;
    background: var(--today); color: #fff; border-radius: 50%;
    border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    pointer-events: auto; cursor: pointer !important;
    animation: pop 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .anno-pin:hover { transform: scale(1.15); }

  .anno-editor {
    position: absolute; z-index: 210; width: 260px;
    background: var(--card); border-radius: 13px;
    box-shadow: var(--shadow); padding: 12px;
    pointer-events: auto;
  }
  .anno-editor textarea {
    width: 100%; height: 72px; resize: none;
    border: 1.5px solid var(--line); border-radius: 9px;
    background: var(--card-2); color: var(--text);
    font-family: inherit; font-size: 12.5px; padding: 8px; outline: none;
  }
  .anno-editor textarea:focus { border-color: var(--c-sport); }
  .anno-editor .target {
    font-size: 10.5px; color: var(--text-3); margin: 7px 0 9px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .anno-editor .btns { display: flex; gap: 7px; }
  .anno-editor .btns button {
    flex: 1; font-size: 12px; padding: 6px 0; border-radius: 8px;
    background: var(--card-2); color: var(--text-2);
    transition: all 0.15s;
  }
  .anno-editor .btns .save { background: var(--today); color: #fff; }
  .anno-editor .btns .save:hover { filter: brightness(1.08); }
  .anno-editor .btns .del:hover { color: var(--c-ddl); background: color-mix(in srgb, var(--c-ddl) 12%, var(--card)); }

  .anno-panel {
    position: fixed; left: 20px; bottom: 64px; z-index: 200;
    width: 300px; max-height: 55vh; overflow-y: auto;
    background: var(--card); border-radius: 15px;
    box-shadow: var(--shadow); padding: 14px; display: none;
  }
  .anno-panel.show { display: block; }
  .anno-panel h3 { font-size: 13px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .anno-panel h3 .cnt { font-size: 11px; color: var(--text-2); font-weight: 400; }
  .anno-item {
    display: flex; gap: 9px; padding: 8px; border-radius: 10px;
    font-size: 12px; line-height: 1.45;
  }
  .anno-item:hover { background: var(--card-2); }
  .anno-item .no {
    flex: none; width: 18px; height: 18px; margin-top: 1px;
    background: var(--today); color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700;
  }
  .anno-item .txt { flex: 1; min-width: 0; }
  .anno-item .tgt { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }
  .anno-item .rm {
    flex: none; align-self: flex-start; color: var(--text-3);
    font-size: 14px; padding: 0 3px;
  }
  .anno-item .rm:hover { color: var(--c-ddl); }
  .anno-empty { font-size: 12px; color: var(--text-3); text-align: center; padding: 14px 0; }
  .anno-actions { display: flex; gap: 7px; margin-top: 11px; }
  .anno-actions button {
    flex: 1; font-size: 11.5px; padding: 7px 0; border-radius: 8px;
    background: var(--card-2); color: var(--text-2); transition: all 0.15s;
  }
  .anno-actions button:hover { color: var(--text); }
  .anno-actions .primary { background: color-mix(in srgb, var(--c-sport) 18%, var(--card)); color: var(--c-sport); font-weight: 600; }
  .anno-toast {
    position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg1);
    font-size: 12.5px; padding: 8px 18px; border-radius: 999px;
    z-index: 300; animation: bubble-in 0.3s ease;
  }

  /* ============ 语音解析预览卡片 ============ */
  .pv-card {
    display: flex; align-items: center; gap: 11px;
    background: var(--card-2); border-radius: 12px; padding: 11px 13px;
    border-left: 3.5px solid var(--cat);
  }
  .pv-dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--cat); }
  .pv-main { flex: 1; min-width: 0; }
  .pv-title { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-meta { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
  .pv-rm {
    flex: none; width: 24px; height: 24px; border-radius: 8px;
    color: var(--text-3); font-size: 12px; transition: all 0.15s;
  }
  .pv-rm:hover { background: var(--card); color: var(--c-ddl); }
  /* 可编辑预览卡片 */
  .pv-edit { align-items: flex-start; }
  .pv-edit .pv-dot { margin-top: 7px; }
  .pv-edit .pv-rm { margin-top: 2px; }
  .pv-input {
    width: 100%;
    border: 1.5px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text);
    font-size: 13px; padding: 6px 9px; outline: none;
    font-family: inherit;
  }
  .pv-input:focus { border-color: var(--c-sport); }
  .pv-title-input { font-weight: 600; font-size: 13.5px; }
  .pv-row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .pv-row .pv-input { flex: 1; min-width: 0; }
  .pv-type { flex: none; font-size: 11px; color: var(--text-3); padding: 0 2px; white-space: nowrap; }

  /* ============ 任务删除（hover 出现的 ✕，今日/本周/日历通用） ============ */
  .t-del {
    flex: none; width: 22px; height: 22px; border-radius: 7px;
    display: none; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-3);
    transition: all 0.15s;
  }
  .task:hover .t-del, .week-item:hover .t-del, .ad-item:hover .t-del { display: flex; }
  .t-del:hover { background: color-mix(in srgb, var(--c-ddl) 12%, var(--card)); color: var(--c-ddl); }
  .ad-item { position: relative; }
  .ad-item .t-del {
    position: absolute; right: 1px; top: 50%; transform: translateY(-50%);
    background: var(--card); box-shadow: var(--shadow-sm); border-radius: 6px;
  }
  .evt .t-del {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
    border-radius: 5px; font-size: 9.5px; color: rgba(255, 255, 255, 0.85);
  }
  .evt:hover .t-del { display: flex; }
  .evt .t-del:hover { background: rgba(255, 255, 255, 0.28); color: #fff; }
  .evt, .ad-item .ad-pill { cursor: pointer; }

  /* ============ 日历月视图（苹果风格） ============ */
  .month-grid {
    height: 100%;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    min-width: 620px;
  }
  .mhead-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--line);
  }
  .mhead-row span { text-align: center; font-size: 11px; color: var(--text-2); padding: 7px 0 6px; letter-spacing: 1px; user-select: none; }
  .mday {
    position: relative;
    border-right: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    padding: 27px 4px 3px;
    overflow: hidden;
    display: flex; flex-direction: column; gap: 2px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .mday:hover { background: var(--card-2); }
  .mday .mnum {
    position: absolute; top: 4px; left: 6px;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--text-2);
  }
  .mday.today .mnum { background: var(--today); color: #fff; }
  .mday.out { opacity: 0.45; }
  .mday .ad-item .ad-pill { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; }
  .mday .ad-pill b { font-weight: 600; opacity: 0.8; margin-right: 3px; }
  .mday .mmore { font-size: 10px; color: var(--text-3); padding-left: 5px; }

  /* ============ 日历日程操作卡片（点日程块弹出） ============ */
  .evt-pop {
    position: fixed; z-index: 320; width: 230px;
    background: var(--card); border-radius: 13px;
    box-shadow: var(--shadow); padding: 13px 14px;
    animation: bubble-in 0.18s ease;
  }
  .evt-pop .ep-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; }
  .evt-pop .ep-meta { font-size: 11.5px; color: var(--text-2); margin-top: 4px; }
  .evt-pop .ep-btns { display: flex; gap: 8px; margin-top: 11px; }
  .evt-pop .ep-btns button {
    flex: 1; font-size: 12px; padding: 7px 0; border-radius: 8px;
    background: var(--card-2); color: var(--text-2); transition: all 0.15s;
  }
  .evt-pop .ep-btns button:hover { color: var(--text); }
  .evt-pop .ep-btns .danger { color: var(--c-ddl); font-weight: 600; }
  .evt-pop .ep-btns .danger:hover { background: color-mix(in srgb, var(--c-ddl) 12%, var(--card)); }

  /* ============ 设置 · AI 解析兜底 ============ */
  .llm-section { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .llm-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .llm-row { margin-bottom: 10px; }
  .llm-row input[type="password"], .llm-row input[type="text"] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card-2); color: var(--text);
    font-size: 13px; padding: 8px 11px; outline: none;
  }
  .llm-row input[type="password"]:focus, .llm-row input[type="text"]:focus { border-color: var(--c-study); }
</style>
</head>
<body>

<!-- 吉祥物 SVG 定义（emmo 风格笑脸） -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mascotFace">
      <circle cx="32" cy="32" r="29" fill="#FFC94D"/>
      <ellipse cx="22.5" cy="27.5" rx="3" ry="4.6" fill="#5B4636"/>
      <ellipse cx="41.5" cy="27.5" rx="3" ry="4.6" fill="#5B4636"/>
      <path d="M21 38 Q32 49 43 38" stroke="#5B4636" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="14.5" cy="35.5" rx="4.2" ry="2.6" fill="#F58BA0" opacity="0.75"/>
      <ellipse cx="49.5" cy="35.5" rx="4.2" ry="2.6" fill="#F58BA0" opacity="0.75"/>
    </g>
    <g id="mascotFaceHappy">
      <circle cx="32" cy="32" r="29" fill="#FFC94D"/>
      <path d="M18.5 29 q3.5 -5.5 7 0" stroke="#5B4636" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M38.5 29 q3.5 -5.5 7 0" stroke="#5B4636" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M22 37 Q32 53 42 37 Q32 43 22 37 Z" fill="#5B4636"/>
      <path d="M28 41.5 Q32 45.5 36 41.5 Q32 43.8 28 41.5 Z" fill="#F58BA0"/>
      <ellipse cx="13.5" cy="34.5" rx="4.2" ry="2.6" fill="#F58BA0" opacity="0.8"/>
      <ellipse cx="50.5" cy="34.5" rx="4.2" ry="2.6" fill="#F58BA0" opacity="0.8"/>
    </g>
  </defs>
</svg>

<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 64 64"><use href="#mascotFace"/></svg>
    <div class="brand-text"><b>叨叨清单</b><i>DAODAO LIST</i></div>
  </div>

  <div class="voice-pill" id="voicePill" title="按住说话">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>
    </svg>
    <span>点击说话 · 待办 / 日程 / 习惯都能说</span>
    <kbd>语音</kbd>
  </div>

  <div class="top-actions">
    <button class="icon-btn" id="routineBtn" title="Routine 习惯打卡看板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/><path d="m9 14.5 2 2 4-4"/>
      </svg><span>打卡</span>
    </button>
    <button class="icon-btn" id="badgesBtn" title="奖章墙">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/>
      </svg><span>奖章</span>
    </button>
    <button class="icon-btn" id="doneBtn" title="已完成 / 归档">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg><span>已完成</span>
    </button>
    <button class="icon-btn bare" id="settingsBtn" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
      </svg>
    </button>
  </div>
</header>

<main id="layout">
  <section id="leftPanels">

    <!-- ── 竖条① 今日 To Do ── -->
    <section class="panel" id="todayPanel">
      <div class="panel-head">
        <h1>今日 To Do</h1><span class="date" id="todayDate"></span>
      </div>
      <div class="day-progress">
        <div class="row"><span id="progText">0/0 已完成</span><b id="progPct">0%</b></div>
        <div class="track"><i id="progBar" style="width:0%"></i></div>
      </div>

      <!-- 今日任务（JS 从 IndexedDB 渲染：输入任务 + 习惯实例 + 顺延） -->
      <div id="todayItems"></div>

      <button class="add-task" id="addTaskBtn" title="打字补充一条">＋ 打字补充一条</button>
    </section>

    <!-- ── 竖条② 本周待办 ── -->
    <section class="panel" id="weekPanel">
      <div class="panel-head"><h1>本周待办</h1><span class="date" id="weekRange"></span></div>

      <div class="routines" id="routineCards"><!-- JS 渲染 --></div>
      <div id="weekItems"><!-- JS 渲染 --></div>
    </section>
  </section>

  <div id="dragBar" title="拖拽调整左右宽度"></div>

  <!-- ── 右面板 · 日历周视图 ── -->
  <section class="panel" id="calendarPanel">
    <header class="cal-head">
      <div class="cal-title">
        <button class="nav-btn" id="calPrev" title="上一周">‹</button>
        <h2 id="calTitle"></h2>
        <button class="nav-btn" id="calNext" title="下一周">›</button>
      </div>
      <div class="cal-controls">
        <button class="today-btn" id="calTodayBtn">今天</button>
        <div class="seg">
          <button class="on" id="segWeek">周</button>
          <button id="segMonth">月</button>
        </div>
      </div>
    </header>
    <div class="cal-scroll" id="calScroll">
      <div class="cal-grid" id="calGrid"><!-- JS 渲染 --></div>
    </div>
  </section>

  <!-- 吉祥物 -->
  <div class="mascot-corner">
    <div class="bubble" id="bubble">今天也要加油鸭！</div>
    <svg class="mascot" viewBox="0 0 64 64" id="mascotBig"><use href="#mascotFace"/></svg>
  </div>
</main>

<!-- 本地个性化配置（可选，被 .gitignore 忽略）：公开克隆里不存在这个文件，浏览器会静默跳过（仅控制台 404），不影响使用 -->
<script src="config.local.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
